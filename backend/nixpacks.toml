# Nixpacks configuration for Railway
# Install system dependencies required for Puppeteer/Chromium

[phases.setup]
nixPkgs = [
  "nodejs_18",
  "npm-9_x"
]

# Apt packages for Chromium dependencies
aptPkgs = [
  "chromium",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2t64",
  "libpangocairo-1.0-0",
  "libxshmfence1",
  "libgtk-3-0",
  "libx11-xcb1",
  "libglu1-mesa",
  "fonts-liberation",
  "ca-certificates"
]

[phases.install]
# Use npm ci for faster, more reliable installs (requires package-lock.json)
# npm ci is faster because it installs directly from package-lock.json
# Flags: --prefer-offline (use cache), --no-audit (skip security audit), --no-fund (skip funding messages)
# Fallback to npm install if package-lock.json doesn't exist
cmds = [
  "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm ci --prefer-offline --no-audit --no-fund --progress=false || PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install --prefer-offline --no-audit --no-fund --progress=false"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium npm run migrate && npm start"

