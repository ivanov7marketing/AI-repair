# Nixpacks configuration for Railway
# Install system dependencies required for Puppeteer/Chromium

[phases.setup]
nixPkgs = [
  "nodejs_18",
  "npm-9_x"
]

# Apt packages for Chromium dependencies
aptPkgs = [
  "chromium",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2t64",
  "libpangocairo-1.0-0",
  "libxshmfence1",
  "libgtk-3-0",
  "libx11-xcb1",
  "libglu1-mesa",
  "fonts-liberation",
  "ca-certificates"
]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run migrate && npm start"

