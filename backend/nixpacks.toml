# Nixpacks configuration for Railway
# Install system dependencies required for Puppeteer/Chromium

[phases.setup]
nixPkgs = [
  "nodejs_18",
  "npm-9_x",
  # Chromium dependencies
  "chromium",
  "nss",
  "freetype",
  "freetype-dev",
  "harfbuzz",
  "ca-certificates",
  "ttf-freefont",
  "font-noto-emoji"
]

# Additional apt packages for Chromium
aptPkgs = [
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpangocairo-1.0-0",
  "libxshmfence1",
  "libgtk-3-0",
  "libx11-xcb1",
  "fonts-liberation"
]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run migrate && npm start"

